name: TaskGraph
version: '${version}'
main: dev.taskgraph.TaskGraphPlugin
description: Communal task dependency graph shown in the vanilla advancements screen
api-version: '26.3'

permissions:
  taskgraph.admin:
    description: Delete any task, release or reassign tasks assigned to other players
    default: op

dependencies:
  server:
    UltimateAdvancementAPI:
      load: BEFORE
      required: true
      join-classpath: true
