# Local test server only. Never use these settings on a public server.
# online-mode=false lets two local clients join with different names to test offline players.
# server-ip keeps the server reachable only from this machine.
online-mode=false
server-ip=127.0.0.1
motd=TaskGraph - servidor de prueba local
gamemode=creative
difficulty=peaceful
spawn-protection=0
level-type=minecraft\:flat
# Flat worlds need explicit layers; an empty generator-settings fails with "No key layers".
generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:dirt","height"\:2},{"block"\:"minecraft\:grass_block","height"\:1}],"biome"\:"minecraft\:plains"}
generate-structures=false
